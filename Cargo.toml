[package]
name = "rl_swapper"
version = "4.1.0"
edition = "2021"
authors = ["c1ya"]
description = "Blazingly fast portable Rocket League Cosmetic Swapper, Workshop Map Loader, Presets & Studio"
build = "build.rs"

[[bin]]
name = "RL_Swapper"
path = "src/bin/swapper_gui.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cipher = "0.4"
ctr = "0.9"
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rfd = "0.15"
dirs = "5.0"
walkdir = "2.5"
chrono = "0.4"
winapi = { version = "0.3", features = ["winuser", "dwmapi", "windef", "processthreadsapi", "tlhelp32", "handleapi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
